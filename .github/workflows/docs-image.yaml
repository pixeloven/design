name: docs image

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/tokens/**"
      - "packages/brand/**"
      - ".github/workflows/docs-image.yaml"
  # The docs read the token and brand packages at BUILD time, so a palette or
  # mark change must produce a new image even though apps/docs did not change —
  # hence those paths above, not just apps/docs.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/docs

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit sha as well as `main`, so a Kubernetes deployment
      # can pin a digest rather than chase a floating tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The build succeeding proves the image exists, not that it serves the
      # site. A Storybook build that silently produced an empty directory would
      # push a green image serving nothing.
      - name: The image actually serves the docs
        run: |
          docker run -d --rm --name docs-check -p 18080:8080 \
            "${IMAGE}:sha-${GITHUB_SHA}"
          for i in $(seq 1 15); do
            sleep 1
            curl -fsS -o /dev/null http://localhost:18080/ && break
          done
          curl -fsS -o /dev/null http://localhost:18080/ \
            || { echo "::error::index did not serve"; docker logs docs-check; exit 1; }
          PAGES=$(curl -fsS http://localhost:18080/index.json \
            | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["entries"]))')
          echo "pages indexed: ${PAGES}"
          if [ "${PAGES}" -lt 4 ]; then
            echo "::error::expected at least 4 documented pages, found ${PAGES}"
            exit 1
          fi
          docker stop docs-check
