<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="PixelOven">
  <title>PixelOven</title>
  <!--
    The parent emblem: a heavy geometric P on a dark tile, with a sparkle.

    This is the EXISTING PixelOven mark, kept deliberately. It is already the
    org avatar and carries whatever recognition the brand has; replacing it to
    match a new palette would have thrown that away to solve a problem the
    palette had, not one the logo had.

    DRAWN AS PATHS, NOT TEXT. The old favicon set the P with `font-family:
    system-ui`, so the letterform changed shape depending on the viewer's
    operating system — a logo that renders differently per visitor is not a
    logo. The outline and counter are explicit geometry here: stroke weight is
    10 on the stem, the bowl top and the bowl side, so the letter stays even at
    any size.

    IN-PALETTE, WHICH THE TILE MAKES EASY. Ground is surface.void, letter is
    text.bright, sparkle is text.dim. Monochrome by intent — the parent does not
    compete with its products for colour; it is the quiet one they sit inside.
    The retired orange tile is gone with the rest of that identity.
  -->

  <!-- The tile. Radius is built in so the emblem reads as one on surfaces that
       do not round it themselves; GitHub rounds avatars regardless. -->
  <rect width="64" height="64" rx="12" fill="#04060a"/>

  <!-- The P: outer silhouette, then the counter punched out with evenodd. -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M15 11 H35 A15 15 0 0 1 35 41 H26 V53 H15 Z
           M26 21 H35 A5 5 0 0 1 35 31 H26 Z"/>

  <!-- The sparkle, bottom right. Small enough to be a detail, not a second mark. -->
  <path fill="#9089ab"
        d="M53 47 Q54 52 59 53 Q54 54 53 59 Q52 54 47 53 Q52 52 53 47 Z"/>
</svg>
